title: Ethan Truong
description: Game developer portfolio — Unity and Unreal projects by Ethan Truong.
url: https://libiki123.github.io
baseurl: /ethan-truong
lang: en

email: bangatruong@gmail.com
social:
  - { name: LinkedIn, icon: fab fa-linkedin, url: "https://www.linkedin.com/in/ethan-truong-abc123/" }
  - { name: GitHub, icon: fab fa-github, url: "https://github.com/libiki123" }
